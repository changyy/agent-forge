; Phorge tuning per https://we.phorge.it/book/contrib/article/php_configuration/
; date.timezone is written at container start from PHORGE_TIMEZONE.
opcache.validate_timestamps = 0
post_max_size = 32M
upload_max_filesize = 32M
memory_limit = 512M
max_execution_time = 60

; Phorge will complain if these are on
always_populate_raw_post_data = -1
