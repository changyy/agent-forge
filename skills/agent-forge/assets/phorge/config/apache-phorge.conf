<VirtualHost *:80>
    DocumentRoot /opt/phorge/phorge/webroot

    RewriteEngine on
    RewriteRule ^(.*)$  /index.php?__path__=$1  [B,L,QSA]

    <Directory "/opt/phorge/phorge/webroot">
        Require all granted
        Options -Indexes
        AllowOverride All
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/phorge_error.log
    CustomLog ${APACHE_LOG_DIR}/phorge_access.log combined
</VirtualHost>
