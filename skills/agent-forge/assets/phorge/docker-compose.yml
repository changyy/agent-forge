# Local Phorge instance for coding agents. Generated by agent-forge.
# All settings come from .env next to this file (created by `forge.js provision`).
# COMPOSE_PROJECT_NAME in .env keeps several instances on one machine apart.

services:
  mysql:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      # Phorge manages many databases itself; root is required.
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    command:
      - --sql-mode=STRICT_ALL_TABLES
      - --local-infile=0
      - --max-allowed-packet=67108864
      - --innodb-buffer-pool-size=256M
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30

  phorge:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      PHORGE_BASE_URI: ${PHORGE_BASE_URI:-http://127.0.0.1:8080/}
      PHORGE_ALLOWED_URIS: ${PHORGE_ALLOWED_URIS:-}
      PHORGE_TIMEZONE: ${PHORGE_TIMEZONE:-UTC}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_REALNAME: ${ADMIN_REALNAME:-Administrator}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      AGENT_USERNAME: ${AGENT_USERNAME:-agent}
      AGENT_EMAIL: ${AGENT_EMAIL:-agent@example.com}
      AGENT_REALNAME: ${AGENT_REALNAME:-Agent}
    ports:
      - "${PHORGE_HOST_PORT:-8080}:80"
    volumes:
      - phorge-files:/var/phorge-files
      - phorge-repos:/var/repo
      - phorge-state:/var/run/phorge

volumes:
  mysql-data:
  phorge-files:
  phorge-repos:
  phorge-state:
